<section class="login">
    <div class="formulario-auth">
        <h2>Iniciar sesión</h2>

        <form id="form-login">
            <div class="campo-formulario">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="correo@ejemplo.com"
                >
            </div>

            <div class="campo-formulario">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="••••••••"
                >
            </div>

            <button type="submit" class="boton boton--completo">
                Ingresar
            </button>
        </form>

        <p class="login__registro">
            ¿No tienes cuenta?
            <a href="#/registro">Regístrate aquí</a>
        </p>
    </div>
</section>
